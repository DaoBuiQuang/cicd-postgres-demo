services:
  postgres:
    image: postgres:16-alpine
    container_name: cicd-demo-postgres
    environment:
      POSTGRES_DB: cicd_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5488:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cicd_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: cicd-demo-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cicd_demo
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:

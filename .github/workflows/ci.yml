name: CI/CD Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the configured demo server
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests and build JAR
        run: mvn -B clean verify
      - name: Upload JAR and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: |
            target/*.jar
            target/surefire-reports/
          if-no-files-found: ignore
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build Docker image
        env:
          APP_IMAGE: ${{ steps.image.outputs.name }}
        run: docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -t "$APP_IMAGE" .
      - name: Test Docker image with real PostgreSQL
        env:
          APP_IMAGE: ${{ steps.image.outputs.name }}
          DB_PASSWORD: ci-demo-password
          APP_PORT: '18080'
          COMPOSE_PROJECT_NAME: cicd-smoke
          SKIP_PULL: 'true'
        run: bash scripts/deploy.sh
      - name: Container logs and cleanup
        if: always()
        env:
          APP_IMAGE: ${{ steps.image.outputs.name }}
          DB_PASSWORD: ci-demo-password
          APP_PORT: '18080'
        run: |
          if [ -n "$APP_IMAGE" ]; then
            docker compose -p cicd-smoke -f docker-compose.deploy.yml logs --tail=100
            docker compose -p cicd-smoke -f docker-compose.deploy.yml down -v
          fi
      - name: Publish image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ steps.image.outputs.name }}
        run: |
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$APP_IMAGE"
          echo "Published: \`$APP_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: build-and-test
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: demo
    concurrency:
      group: demo-deployment
      cancel-in-progress: false
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Deploy exact commit image over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          APP_IMAGE: ${{ needs.build-and-test.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Configure DEPLOY_HOST}"
          : "${DEPLOY_USER:?Configure DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Configure DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Configure DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$APP_IMAGE" =~ ^ghcr.io/[a-z0-9._/-]+:[a-f0-9]{40}$ ]]
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          opts=(-i "$ssh_dir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15)
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh "${opts[@]}" -p "$DEPLOY_PORT" "$remote" 'mkdir -p "$HOME/cicd-postgres-demo/scripts"'
          scp "${opts[@]}" -P "$DEPLOY_PORT" docker-compose.deploy.yml "$remote:cicd-postgres-demo/"
          scp "${opts[@]}" -P "$DEPLOY_PORT" scripts/deploy.sh "$remote:cicd-postgres-demo/scripts/"
          ssh "${opts[@]}" -p "$DEPLOY_PORT" "$remote" "cd ~/cicd-postgres-demo && APP_IMAGE='$APP_IMAGE' bash scripts/deploy.sh"
          echo "Deployed and verified: \`$APP_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
